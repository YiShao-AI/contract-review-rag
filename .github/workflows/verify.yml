name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      DATA_DIR: ${{ github.workspace }}/.ci-data
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Verify fictional corpus integrity
        run: sha256sum --check eval/corpus.sha256
      - name: Run focused verification suite
        run: python -m unittest discover -s tests -v
      - name: Run isolated reliability gate
        run: >-
          python benchmarking/run_reliability_evidence.py
          --output-dir "${{ runner.temp }}/reliability-evidence"

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run interaction and accessibility checks
        run: npm run test:browser

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build release image
        run: docker build --tag contract-review-rag:verification .
